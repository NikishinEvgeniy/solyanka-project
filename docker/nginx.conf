
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Страница авторизации
    location = /login {
        return 301 /login/;
    }

    location = /login/ {
        try_files /login/index.html =404;
    }

    location /login/ {
        try_files $uri $uri/ =404;
    }

    # Собранные JS, CSS и другие ресурсы.
    # Если файла нет, возвращаем 404, а не HTML.
    location ~* \.(js|mjs|css|map|png|jpg|jpeg|svg|webp|ico|woff|woff2|ttf)$ {
        try_files $uri =404;
    }

    # Главная страница React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
