services:
  minio:
    image: rancher/mirrored-minio-minio:RELEASE.2020-07-13T18-09-56Z
    ports:
      - "9000:9000"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: server /data
    volumes:
      - minio_data:/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak
      KC_HTTP_PORT: 9090
    ports:
      - "9090:9090"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/solyanka-realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./frontend/src/library/keycloak/solyanka:/opt/keycloak/themes/solyanka
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: solyanka
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d solyanka" ]
      interval: 5s
      timeout: 5s
      retries: 3
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend 
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
  site:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - "3000:80"

volumes:
  minio_data:
  keycloak_data:
  postgres_data: