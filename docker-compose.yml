services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: solyanka
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend 
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data: