services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: solyanka
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend 
    ports:
      - 8080:8080
    depends_on:
      - postgres
  site:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - 3000:80

volumes:
  postgres_data: