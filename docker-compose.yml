services:
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: my_password
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend 
    ports:
      - 8080:8080