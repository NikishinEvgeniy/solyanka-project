services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 9090
    ports:
      - 9090:9090
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/solyanka-realm.json:/opt/keycloak/data/import/realm.json:ro
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: solyanka
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend 
    ports:
      - 8080:8080
    depends_on:
      - postgres
  site:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    ports:
      - 3000:80

volumes:
  keycloak_data:
  postgres_data: