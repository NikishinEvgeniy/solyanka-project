services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    env_file:
      - .env
    command: start-dev
    ports:
      - 9090:9090
    volumes:
      - keycloak_data:/opt/keycloak/data
  postgres:
    image: postgres:18
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend 
    env_file:
      - .env
    ports:
      - 8080:8080
    depends_on:
      - postgres
  site:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    env_file:
      - .env
    ports:
      - 3000:80

volumes:
  keycloak_data:
  postgres_data: