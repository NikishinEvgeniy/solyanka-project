<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Солянка — вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Декоративный слой -->
    <div class="decor" aria-hidden="true">
        <img class="decor__tiles" src="assets/bg-tiles.svg" alt="">
        <img class="decor__petals" src="assets/petals.svg" alt="">
        <img class="decor__berry decor__berry--big" src="assets/strawberry.svg" alt="">
        <img class="decor__berry decor__berry--small" src="assets/strawberry.svg" alt="">
    </div>

    <!-- Здесь больше НЕТ формы логина: вход происходит на странице
         Keycloak (тема solyanka). Эта страница только запускает вход. -->
    <main class="page">
        <div class="card">
            <h1 class="card__title">Солянка</h1>
            <hr class="card__divider">
            <p class="card__text" id="status">Проверяем авторизацию...</p>
            <button class="card__submit" id="login-btn" hidden>Вход</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/keycloak-js@25/dist/keycloak.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
