databaseChangeLog:
  - changeSet:
      id: 1
      author: Leonid
      changes:
        - createTable:
            tableName: recipes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_recipes
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: recipes
            columnNames: name
            constraintName: uq_recipes_name