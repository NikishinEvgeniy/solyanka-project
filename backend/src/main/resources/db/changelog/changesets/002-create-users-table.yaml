databaseChangeLog:
  - changeSet:
      id: 002-create-users-table
      author: Leonid
      changes:
        - createTable:
            tableName: users
            schemaName: solyanka
            ifNotExist: true
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                    name: username
                    type: VARCHAR(50)
                    constraints:
                      nullable: false
                      unique: true
              - column:
                    name: email
                    type: VARCHAR(50)
                    constraints:
                      nullable: false
                      unique: true
              - column:
                    name: password
                    type: VARCHAR(64)
                    constraints:
                      nullable: false
              - column:
                    name: role
                    type: VARCHAR(50)
                    constraints:
                      nullable: false