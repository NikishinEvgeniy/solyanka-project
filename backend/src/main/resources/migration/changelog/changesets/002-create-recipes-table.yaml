databaseChangeLog:
  - changeSet:
      id: 002-create-recipes-table
      author: Leonid
      changes:
        - createTable:
            tableName: recipes
            schemaName: solyanka
            ifNotExists: true
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(200)
                  constraints:
                    nullable: true
              - column:
                  name: author_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false