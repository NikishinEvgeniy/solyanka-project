databaseChangeLog:
  - changeSet:
      id: 004-create-ingredients-table
      author: Leonid
      changes:
        - createTable:
            schemaName: solyanka
            tableName: ingredients
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_ingredients
              - column:
                  name: recipe_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(10, 5)
                  constraints:
                    nullable: false
              - column:
                  name: unit
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: solyanka
            tableName: ingredients
            columnNames: recipe_id, product_id
            constraintName: uc_ingredients_recipe_product

        - addForeignKeyConstraint:
            schemaName: solyanka
            baseTableName: ingredients
            baseColumnNames: recipe_id
            constraintName: fk_ingredients_recipe
            referencedTableName: recipes
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            schemaName: solyanka
            baseTableName: ingredients
            baseColumnNames: product_id
            constraintName: fk_ingredients_product
            referencedTableName: products
            referencedColumnNames: id
            onDelete: CASCADE