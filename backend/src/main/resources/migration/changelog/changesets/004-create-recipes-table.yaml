databaseChangeLog:
  - changeSet:
      id: 002-create-recipes-table
      author: Leonid
      changes:
        - createTable:
            tableName: recipes
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(200)
                  constraints:
                    nullable: true
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: recipes
            baseColumnNames: author_id
            constraintName: fk_recipes_author
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT