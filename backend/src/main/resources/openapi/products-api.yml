openapi: 3.0.3

info:
  title: Solyanka Products API
  description: CRUD для сущности products (база solyanka)
  version: 1.0.0

servers:
  - url: http://localhost:8080

tags:
  - name: products
    description: Управление ингредиентами

paths:
  /api/v1/products:
    get:
      tags: [products]
      operationId: getAllProducts
      summary: Получить все ингредиенты
      responses:
        '200':
          description: Список ингредиентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDto'
    post:
      tags: [products]
      operationId: createProduct
      summary: Создать ингредиент
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Ингредиент создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '400':
          description: Некорректный запрос

  /api/v1/products/{id}:
    get:
      tags: [products]
      operationId: getProductById
      summary: Получить ингредиент по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ингредиент найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          description: Ингредиент не найден
    put:
      tags: [products]
      operationId: updateProduct
      summary: Обновить ингредиент
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Ингредиент обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDto'
        '404':
          description: Ингредиент не найден
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Удалить ингредиент
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Ингредиент удалён
        '404':
          description: Ингредиент не найден

components:
  schemas:
    ProductDto:
      type: object
      required: [id, title, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          maxLength: 50
          example: "Банан"
        description:
          type: string
          example: "Желтый банан, вкусный"
        image_url:
          type: string
          maxLength: 200
          example: "https://example.com/images/banana.jpg"
        created_at:
          type: string
          format: date-time
          example: "2026-10-19T12:00:00Z"
        unit:
          type: string
          maxLength: 10
          example: "гр."

    CreateProductRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 50
          example: "Зелёный виноград"
        description:
          type: string
          example: "Зелёный"
        image_url:
          type: string
          maxLength: 200
          example: "https://example.com/images/green_grape.jpg"
        unit:
          type: string
          maxLength: 10
          example: "гр."

    UpdateProductRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 50
        description:
          type: string
        image_url:
          type: string
          maxLength: 200
        unit:
          type: string
          maxLength: 10