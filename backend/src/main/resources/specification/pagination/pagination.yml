PageMetadata:
  type: object
  required: [page, size, totalElements, totalPages, last]
  properties:
    page:
      type: integer
      format: int32
    size:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    totalPages:
      type: integer
      format: int32
    last:
      type: boolean