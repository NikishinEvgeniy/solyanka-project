openapi: 3.0.3
info:
  title: Спецификация редактирования рецепта
  version: 1.0.0
paths:
  /api/v1/recipes:
    post:
      tags: [recipe-edit]
      operationId: editRecipe
      summary: Изменение рецепта
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditRecipeRequestV1'
      responses:
        '200':
          description: Успешное изменение рецепта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditRecipeResponseV1'
        '403':
          $ref: '../responses/bad-request-v1.yml'
        '409':
          $ref: '../responses/bad-request-v1.yml'
        '500':
          $ref: '../responses/internal-server-error-v1.yml'
components:
  schemas:
    EditRecipeRequestV1:
      type: object
      required: [title, description, image]
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
        image:
          type: string
          format: binary
          description: Файл изображения
    EditRecipeResponseV1:
      type: object
      required: [id, title, description, author_id, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 20
        description:
          type: string
        image_url:
          type: string
          nullable: true
          maxLength: 255
        author_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time