openapi: 3.0.3
info:
  title: Спецификация добавления ингредиента
  version: 1.0.0
paths:
  /api/v1/recipes/{id}/ingredients:
    post:
      tags: [ingredient-add]
      operationId: addIngredient
      summary: Добавление ингредиента
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор рецепта
          schema:
            type: integer
            format: int64
        - name: product_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: amount
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: unit
          in: query
          required: true
          schema:
            type: string
            maxLength: 50
      responses:
        '201':
          description: Успешное добавление ингредиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddIngredientResponseV1'
        '403':
          $ref: '../responses/forbidden-v1.yml'
        '409':
          $ref: '../responses/conflict-v1.yml'
        '500':
          $ref: '../responses/internal-server-error-v1.yml'
components:
  schemas:
    AddIngredientResponseV1:
      type: object
      required: [message]
      properties:
        message:
          type: string