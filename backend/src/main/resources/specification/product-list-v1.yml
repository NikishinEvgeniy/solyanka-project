openapi: 3.0.3
info:
  title: Спецификация получения продуктов
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/v1/products:
    get:
      tags: [product-list]
      operationId: getProducts
      summary: Получение списка продуктов
      responses:
        '200':
          description: Успешное получение списка продуктов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponseV1'
        '400':
          $ref: './responses/bad-request-v1.yml'
        '500':
          $ref: './responses/internal-server-error-v1.yml'
components:
  schemas:
    ProductListResponseV1:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCardResponseV1'
    ProductCardResponseV1:
      type: object
      required: [id, title]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        image_url:
          type: string